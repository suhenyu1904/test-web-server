<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Testing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Web Testing</h1>
        <p>Halaman untuk testing</p>
    </header>

    <main>
        <section class="container">
            <h2>Testing otomatis semoga bisa</h2>
            <form id="testForm">
                <div class="form-group">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan:</label>
                    <textarea id="pesan" name="pesan" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn">Kirim</button>
            </form>
        </section>

        <section class="container">
            <h2>Output</h2>
            <div id="output" class="output"></div>
        </section>

        <section class="container">
            <h2>List Item</h2>
            <ul id="itemList">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
            <input type="text" id="newItem" placeholder="Tambah item baru">
            <button type="button" class="btn" id="addBtn">Tambah</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Testing. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
